<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <title>World in Dreams roadmap: five phases and twelve milestones</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6f4e"/>
    </marker>
    <style>
      .head { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #fffaf0; }
      .phase { font-size: 15px; font-weight: 600; fill: #fffaf0; }
      .id { font-size: 20px; font-weight: 800; }
      .name { font-size: 14.5px; font-weight: 600; fill: #3b2a1e; }
      .meta { font-size: 12px; fill: #6d5a47; }
      .gate { font-size: 15px; font-weight: 600; fill: #3b2a1e; }
      .gatesub { font-size: 13px; fill: #6d5a47; }
      .title { font-size: 20px; font-weight: 700; fill: #3b2a1e; }
      .sub { font-size: 13.5px; fill: #6d5a47; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="500" rx="18" fill="#f6efe1"/>
  <text x="30" y="40" class="title">From an empty land to a world of heroes and monsters</text>
  <text x="1170" y="40" class="sub" text-anchor="end">Each phase builds on the one before it</text>

  <!-- Phase A -->
  <rect x="30" y="62" width="212" height="62" rx="10" fill="#5d8f34"/>
  <text x="46" y="86" class="head">PHASE A</text>
  <text x="46" y="110" class="phase">The land before people</text>
  <rect x="30" y="140" width="212" height="66" rx="10" fill="#fffaf0" stroke="#5d8f34" stroke-width="2"/>
  <text x="44" y="166" class="id" fill="#5d8f34">M1</text><text x="84" y="166" class="name">Living land</text>
  <text x="44" y="192" class="meta">Relief, water, climate, animals · XL</text>
  <rect x="30" y="218" width="212" height="66" rx="10" fill="#fffaf0" stroke="#5d8f34" stroke-width="2"/>
  <text x="44" y="244" class="id" fill="#5d8f34">M2</text><text x="84" y="244" class="name">World creation</text>
  <text x="44" y="270" class="meta">Calendar and map settings · M</text>
  <rect x="30" y="296" width="212" height="66" rx="10" fill="#fffaf0" stroke="#5d8f34" stroke-width="2"/>
  <text x="44" y="322" class="id" fill="#5d8f34">M3</text><text x="84" y="322" class="name">Observer's window</text>
  <text x="44" y="348" class="meta">Simple tabs, animal inspector · M</text>

  <!-- Phase B -->
  <rect x="262" y="62" width="212" height="62" rx="10" fill="#c8532f"/>
  <text x="278" y="86" class="head">PHASE B</text>
  <text x="278" y="110" class="phase">The first kingdom</text>
  <rect x="262" y="140" width="212" height="66" rx="10" fill="#fffaf0" stroke="#c8532f" stroke-width="2"/>
  <text x="276" y="166" class="id" fill="#c8532f">M4</text><text x="316" y="166" class="name">The first kingdom</text>
  <text x="276" y="192" class="meta">Today's people on the new land · XL</text>
  <rect x="262" y="218" width="212" height="66" rx="10" fill="#fffaf0" stroke="#c8532f" stroke-width="2"/>
  <text x="276" y="244" class="id" fill="#c8532f">M5</text><text x="316" y="244" class="name">A solid engine</text>
  <text x="276" y="270" class="meta">Collision, speed, saves · L</text>
  <rect x="262" y="296" width="212" height="66" rx="10" fill="#fffaf0" stroke="#c8532f" stroke-width="2"/>
  <text x="276" y="322" class="id" fill="#c8532f">M6</text><text x="316" y="322" class="name">Two views</text>
  <text x="276" y="348" class="meta">Calm UI + developer console · M</text>

  <!-- Phase C -->
  <rect x="494" y="62" width="212" height="62" rx="10" fill="#8e3b3f"/>
  <text x="510" y="86" class="head">PHASE C</text>
  <text x="510" y="110" class="phase">Society and chaos</text>
  <rect x="494" y="140" width="212" height="66" rx="10" fill="#fffaf0" stroke="#8e3b3f" stroke-width="2"/>
  <text x="508" y="166" class="id" fill="#8e3b3f">M7</text><text x="548" y="166" class="name">Society and chaos</text>
  <text x="508" y="192" class="meta">Classes, nobles, bandits, crises · XL</text>
  <rect x="494" y="218" width="212" height="66" rx="10" fill="#fffaf0" stroke="#8e3b3f" stroke-width="2"/>
  <text x="508" y="244" class="id" fill="#8e3b3f">M8</text><text x="548" y="244" class="name">Stabilise, simplify</text>
  <text x="508" y="270" class="meta">Measure, fix, cut what fails · M</text>

  <!-- Phase D -->
  <rect x="726" y="62" width="212" height="62" rx="10" fill="#b8892a"/>
  <text x="742" y="86" class="head">PHASE D</text>
  <text x="742" y="110" class="phase">Heroes and power</text>
  <rect x="726" y="140" width="212" height="66" rx="10" fill="#fffaf0" stroke="#b8892a" stroke-width="2"/>
  <text x="740" y="166" class="id" fill="#9a7020">M9</text><text x="780" y="166" class="name">Attributes, levels</text>
  <text x="740" y="192" class="meta">STR DEX VIT INT LUK CHA · L</text>
  <rect x="726" y="218" width="212" height="66" rx="10" fill="#fffaf0" stroke="#b8892a" stroke-width="2"/>
  <text x="740" y="244" class="id" fill="#9a7020">M10</text><text x="790" y="244" class="name">Combat and magic</text>
  <text x="740" y="270" class="meta">Real time, attribute-driven · L</text>

  <!-- Phase E -->
  <rect x="958" y="62" width="212" height="62" rx="10" fill="#2f6fb8"/>
  <text x="974" y="86" class="head">PHASE E</text>
  <text x="974" y="110" class="phase">A richer world</text>
  <rect x="958" y="140" width="212" height="66" rx="10" fill="#fffaf0" stroke="#2f6fb8" stroke-width="2"/>
  <text x="972" y="166" class="id" fill="#2f6fb8">M11</text><text x="1022" y="166" class="name">Richer cities</text>
  <text x="972" y="192" class="meta">Castles, churches, many rooms · L</text>
  <rect x="958" y="218" width="212" height="66" rx="10" fill="#fffaf0" stroke="#2f6fb8" stroke-width="2"/>
  <text x="972" y="244" class="id" fill="#2f6fb8">M12</text><text x="1022" y="244" class="name">Wild places</text>
  <text x="972" y="270" class="meta">Dungeons, lairs, goblins · XL</text>

  <!-- flow between phases -->
  <line x1="244" y1="93" x2="259" y2="93" stroke="#8a6f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="93" x2="491" y2="93" stroke="#8a6f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="708" y1="93" x2="723" y2="93" stroke="#8a6f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="93" x2="955" y2="93" stroke="#8a6f4e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- quality gate -->
  <rect x="30" y="392" width="1140" height="78" rx="12" fill="#efe3c9" stroke="#b59a66" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="64" cy="431" r="16" fill="#5d8f34"/>
  <path d="M56,431 l6,6 l11,-12" stroke="#fffaf0" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="425" class="gate">Quality gate after every milestone — the world may die; the game must not break</text>
  <text x="94" y="449" class="gatesub">Tests pass · several in-game years on three seeds without crashes or impossible numbers · speed within budget · docs updated · simplify what fails</text>
</svg>

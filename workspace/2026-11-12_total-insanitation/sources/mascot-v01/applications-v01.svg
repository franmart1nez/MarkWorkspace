    </g>
    <g id="pose-slipping"><g id="falling-body" transform="rotate(-25 335 485)">
      <use href="#head-standard" transform="translate(-30 15)"/>
      <path id="slipping-torso" d="M276 338 Q301 324 320 345 L368 468 L307 501Z" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path d="M290 353 L385 312 L418 260 M281 366 L198 398 L153 360"/></g><circle cx="418" cy="260" r="18" fill="currentColor"/><circle cx="153" cy="360" r="18" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="41" stroke-linecap="round" stroke-linejoin="round"><path d="M333 473 L393 530 L476 490 M340 490 L329 581 L403 635"/></g><ellipse cx="489" cy="487" rx="33" ry="16" fill="currentColor" transform="rotate(-20 489 487)"/><ellipse cx="415" cy="640" rx="33" ry="16" fill="currentColor" transform="rotate(25 415 640)"/>
      </g><path id="wet-floor-cue" d="M270 700 Q361 676 470 700 M309 719 Q367 707 426 719" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    </g>
    </defs><rect width="1400" height="1200" fill="#f3efdf"/><text x="48" y="48" font-size="15" font-weight="700" fill="#171713" letter-spacing="2">STAGE 4 / SHARED FIRST REVIEW</text><text x="48" y="105" font-size="44" font-weight="700" fill="#171713" >One wizard, three applications</text><text x="48" y="144" font-size="20" font-weight="400" fill="#676457" >Action studies support the master review. The sign system remains provisional.</text><text x="50" y="199" font-size="20" font-weight="700" fill="#171713" >01 / Direction</text><rect x="50" y="230" width="410" height="650" rx="20" fill="#fbf8ec" stroke="#171713" stroke-width="9"/><text x="255.0" y="292" font-size="24" font-weight="700" fill="#171713" text-anchor="middle" letter-spacing="2">STAFF ACCESS</text><path d="M75 316H435" stroke="#171713" stroke-width="3"/><svg x="70" y="326" width="370" height="350" viewBox="-100 0 800 800" style="color:#171713"><use href="#pose-point-right"/></svg><text x="255.0" y="720" font-size="37" font-weight="700" fill="#171713" text-anchor="middle">JANITOR</text><text x="255.0" y="768" font-size="37" font-weight="700" fill="#171713" text-anchor="middle">SERVICES</text><path d="M155 824H355 M321 794L357 824L321 854" fill="none" stroke="#171713" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter"/><text x="500" y="199" font-size="20" font-weight="700" fill="#171713" >02 / Cleaning instruction</text><rect x="500" y="230" width="410" height="650" rx="20" fill="#fbf8ec" stroke="#171713" stroke-width="9"/><text x="705.0" y="292" font-size="24" font-weight="700" fill="#171713" text-anchor="middle" letter-spacing="2">STAFF NOTICE</text><path d="M525 316H885" stroke="#171713" stroke-width="3"/><svg x="520" y="326" width="370" height="350" viewBox="-100 0 800 800" style="color:#171713"><use href="#pose-mopping"/></svg><text x="705.0" y="720" font-size="37" font-weight="700" fill="#171713" text-anchor="middle">KEEP FLOORS</text><text x="705.0" y="768" font-size="37" font-weight="700" fill="#171713" text-anchor="middle">CLEAN</text><text x="705.0" y="835" font-size="15" font-weight="700" fill="#171713" text-anchor="middle" letter-spacing="1.5">CLEANING INSTRUCTION</text><text x="950" y="199" font-size="20" font-weight="700" fill="#171713" >03 / Hazard</text><rect x="950" y="230" width="410" height="650" rx="20" fill="#f4cb3d" stroke="#171713" stroke-width="9"/><text x="1155.0" y="292" font-size="36" font-weight="700" fill="#171713" text-anchor="middle" letter-spacing="2">CAUTION</text><path d="M975 316H1335" stroke="#171713" stroke-width="3"/><svg x="970" y="326" width="370" height="350" viewBox="-100 0 800 800" style="color:#171713"><use href="#pose-slipping"/></svg><text x="1155.0" y="720" font-size="37" font-weight="700" fill="#171713" text-anchor="middle">WET</text><text x="1155.0" y="768" font-size="37" font-weight="700" fill="#171713" text-anchor="middle">FLOOR</text><text x="1155.0" y="835" font-size="15" font-weight="700" fill="#171713" text-anchor="middle" letter-spacing="1.5">SLIP HAZARD</text><text x="48" y="944" font-size="21" font-weight="400" fill="#171713" >Direction: staff switches to the support hand. Cleaning and falling: staff omitted for action clarity.</text><text x="48" y="976" font-size="21" font-weight="400" fill="#171713" >The same head/hat geometry and limb weights carry through all studies. Copy, color and type are proposals.</text><text x="48" y="1008" font-size="21" font-weight="400" fill="#171713" >English text stays editable. No atlas, localization binding or Unreal asset has been changed.</text></svg>

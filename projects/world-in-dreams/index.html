<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World in Dreams</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <header id="bar">
    <strong class="brand">World in Dreams</strong>
    <span id="date" class="date"></span>
    <div class="group" id="speeds" title="Game time per second. Space pauses, 1-6 set the speed, . advances one minute">
      <button data-speed="0" title="Pause (Space)">❚❚</button>
      <button data-speed="0.25" title="Close-up pace: 15 game seconds per second">¼</button>
      <button data-speed="1" title="1 game minute per second">1m</button>
      <button data-speed="6" title="6 game minutes per second">6m</button>
      <button data-speed="30" title="Half an hour per second">30m</button>
      <button data-speed="180" title="3 hours per second">3h</button>
      <button data-speed="720" title="Half a day per second">12h</button>
    </div>
    <div class="group">
      <button id="viewCity" title="Frame the city (C)">City</button>
      <button id="viewRegion" title="Frame the whole region (R)">Region</button>
      <label><input type="checkbox" id="lyLabels" checked> Names</label>
      <label><input type="checkbox" id="lyNight" checked> Night</label>
      <label title="Lift the roofs when zoomed in close"><input type="checkbox" id="lyInside" checked> Interiors</label>
    </div>
    <div class="group right">
      <input id="seed" size="10" placeholder="seed" title="World seed: the same seed always creates the same region and history">
      <button id="newWorld">New world</button>
      <button id="save" title="Save in this browser">Save</button>
      <button id="load" title="Load the browser save">Load</button>
      <button id="export" title="Download the world as a JSON file">Export</button>
      <button id="import" title="Open a JSON save file">Import</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="map"></canvas>
      <div id="tip" hidden></div>
      <div id="hud"></div>
      <div id="hint">Drag to pan · wheel to zoom · click anyone or anything · double-click a person to follow</div>
      <div id="toast" hidden></div>
    </div>
    <aside id="side">
      <nav id="tabs">
        <button data-tab="inspect" class="on">Inspect</button>
        <button data-tab="region">Region</button>
        <button data-tab="people">People</button>
      </nav>
      <section id="panel"></section>
      <section id="chronicle">
        <div class="chron-head">
          <strong>Chronicle</strong>
          <span id="filters"></span>
          <label title="Show everyday events"><input type="checkbox" id="minor"> everyday</label>
        </div>
        <ol id="events"></ol>
      </section>
    </aside>
  </main>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
